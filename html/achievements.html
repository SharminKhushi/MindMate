<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achievements — MindMate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="achievements">

<div class="app-shell">

  <aside class="app-sidebar">
    <a href="dashboard.html" class="brand">
      <span class="brand-mark"><i class="fa-solid fa-heart-pulse"></i></span>
      MindMate
    </a>
    <nav class="sidebar-nav">
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="journal.html"><i class="fa-solid fa-book-open"></i> Journal</a>
      <a href="mood.html"><i class="fa-solid fa-face-smile"></i> Mood Check-in</a>
      <a href="goals.html"><i class="fa-solid fa-bullseye"></i> Goals &amp; Habits</a>
      <a href="challenges.html"><i class="fa-solid fa-flag-checkered"></i> Challenges</a>
      <a href="achievements.html"><i class="fa-solid fa-trophy"></i> Achievements</a>
      <a href="selfhelp.html"><i class="fa-solid fa-hand-holding-heart"></i> Self-Help</a>
      <a href="calm.html"><i class="fa-solid fa-spa"></i> Calm Corner</a>
      <a href="help.html"><i class="fa-solid fa-circle-question"></i> Help &amp; Guide</a>
      <div class="nav-divider"></div>
      <a href="profile.html"><i class="fa-solid fa-user-gear"></i> Profile &amp; Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-avatar" id="sidebarAvatar">M</div>
      <div class="sidebar-user-info">
        <strong id="sidebarUserName">—</strong>
        <span id="sidebarUserEmail">—</span>
      </div>
      <button class="sidebar-logout" id="logoutBtn" aria-label="Log out" title="Log out">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <h1>Your Achievements</h1>
      <div class="app-topbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="knob"><i class="fa-solid fa-moon"></i></span>
        </button>
      </div>
    </div>

    <p style="color:var(--text-secondary); font-size:0.92rem; margin-bottom:var(--sp-5);">
      Every badge here reflects real effort — locked ones just show how close you are, not what you're missing.
    </p>

    <div class="achievements-grid" id="achievementsGrid"></div>
  </main>
</div>

<nav class="bottom-tabbar">
  <a href="dashboard.html"><i class="fa-solid fa-house"></i>Home</a>
  <a href="journal.html"><i class="fa-solid fa-book-open"></i>Journal</a>
  <a href="mood.html"><i class="fa-solid fa-face-smile"></i>Mood</a>
  <a href="goals.html"><i class="fa-solid fa-bullseye"></i>Goals</a>
  <a href="profile.html"><i class="fa-solid fa-user"></i>Profile</a>
</nav>

<script src="../js/app.js"></script>
<script src="../js/achievements.js"></script>
</body>
</html>
